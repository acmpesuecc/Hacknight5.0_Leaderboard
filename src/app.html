<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/lime_logo.svg" />
    <meta name="viewport" content="width=device-width" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <div class="hero-section">
    </div>
    <div class="leaderboard-section">
    </div>

    <script>
        const heroVisibilityTime = 5000;
        let userInteractionDetected = false;
        function autoScrollToLeaderboard() {
            if (!userInteractionDetected) {
                const leaderboardSection = document.querySelector('.leaderboard-section');
                if (leaderboardSection) {
                    leaderboardSection.scrollIntoView({ behavior: 'smooth' });
                }
            }
        }
        setTimeout(autoScrollToLeaderboard, heroVisibilityTime);
        window.addEventListener('scroll', () => {
            userInteractionDetected = true;
        });
    </script>
  
  </body>
</html>
